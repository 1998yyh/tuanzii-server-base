# 安装为 /etc/systemd/system/dsh-whale.service.d/session.conf，先备份原 unit。
[Service]
RuntimeDirectory=dsh-whale-auth
RuntimeDirectoryMode=0700
Environment=DSH_TOKEN_FILE=/run/dsh-whale-auth/launch-token
ExecStart=
ExecStart=/opt/dsh-whale/runtime/node/bin/node /var/projects/tuanzi-server-base/scripts/capture-dsh-launch.mjs /opt/dsh-whale/app/node_modules/@deepseek-ai/dsh/lib/bin.js web --host 127.0.0.1 --port 3080 --no-open --public-url https://43.140.214.49/dsh/ --trusted-host 43.140.214.49
